# Praxis -> vLLM (native Responses API)
#
# vLLM implements /v1/responses itself, so Praxis just routes here.
# Contrast ogx.yaml pointed at Ollama, which is Chat-only and needs
# the responses_to_chat_completions translation chain.
#
#   client -> 127.0.0.1:8080 (Praxis) -> 127.0.0.1:8000 (vLLM)
#
# Start vLLM first. gpt-oss:20b is Ollama tag syntax; vLLM wants the
# HuggingFace id:
#
#   vllm serve openai/gpt-oss-20b \
#     --port 8000 \
#     --max-model-len 16384 \
#     --enable-auto-tool-choice \
#     --tool-call-parser openai \
#     --gpu-memory-utilization 0.9 \
#     --seed 0
#
# Wait for readiness before sending traffic (first run pulls ~40GB):
#
#   until curl -sf http://127.0.0.1:8000/health >/dev/null; do sleep 5; done
#   curl -sf http://127.0.0.1:8000/v1/models | jq '.data[].id'
#
# Run Praxis:
#   cargo run -p praxis-ai-proxy -- -c vllm.yaml -t   # validate only
#   cargo run -p praxis-ai-proxy -- -c vllm.yaml      # serve
#   cargo run -p praxis-ai-proxy -- -c vllm.yaml -T   # dump effective config
#
# Try it. The model must match what /v1/models reports:
#
#   curl -sS http://127.0.0.1:8080/v1/responses \
#     -H 'Content-Type: application/json' \
#     -d '{"model":"openai/gpt-oss-20b","input":"Explain a reverse proxy in two sentences."}' | jq
#
#   curl -sSN http://127.0.0.1:8080/v1/responses \
#     -H 'Content-Type: application/json' \
#     -H 'Accept: text/event-stream' \
#     -d '{"model":"openai/gpt-oss-20b","input":"Count from 1 to 5.","stream":true}'

admin:
  address: "127.0.0.1:9901"

# log_overrides is per-module, which beats a blanket RUST_LOG=debug
# that buries you in Pingora internals. non_blocking: false flushes
# each line immediately so nothing is lost on Ctrl-C.
#
# RUST_LOG still wins if it is set, so unset it for these to apply.
runtime:
  logging:
    output: stdout
    non_blocking: false
  log_overrides:
    praxis_ai_apis: debug # classification and Responses filters
    praxis_ai_filters: debug # routing, credentials, token usage
    praxis_filter: info # core pipeline; debug here is very loud

listeners:
  - name: ai-gateway
    address: "127.0.0.1:8080"
    filter_chains: [vllm]

filter_chains:
  - name: vllm
    filters:
      # Same role as in ogx.yaml: classify the body and publish
      # labels. Nothing below reads them — routing here is purely
      # path based. It earns its place by installing the OpenAI
      # error formatter (so failures come back as OpenAI-shaped
      # JSON rather than RFC 9457 problem details), and by setting
      # the model metadata that token_usage_headers and
      # time_to_first_token read if you add them later.
      #
      # on_invalid: continue matters — a body it cannot classify
      # passes through instead of getting a 400. With reject, a
      # GET /v1/models would start failing.
      - filter: openai_responses_format
        on_invalid: continue
        headers:
          format: x-praxis-ai-format
          model: x-praxis-ai-model

      # Parses the body once and builds the request state the store
      # and rehydrate filters below consume.
      - filter: openai_responses_validate

      # Who owns stored state. single_tenant is the explicit
      # "one user, no isolation" mode — fine locally. The real
      # modes bind identity from a trusted header or a policy
      # engine so one tenant cannot read another's responses.
      - filter: state_owner
        mode: single_tenant
        tenant_id: default

      # Durable Responses/Conversations storage. This is what vLLM
      # has no equivalent of — restart Praxis and continuations
      # still resolve. Writes ./vllm-responses.db.
      - filter: openai_response_store
        backend: sqlite
        database_url: "sqlite://vllm-responses.db?mode=rwc"
        responses_table: openai_responses
        conversations_table: openai_conversations

      # Turns previous_response_id into the full prior turn, so the
      # client never resends history. Must run after the store, which
      # it reads from.
      - filter: openai_responses_rehydrate

      # Rebuilds the outgoing body from the rehydrated state: swaps
      # input for the resolved history and strips previous_response_id,
      # which Praxis has already consumed.
      #
      # Without this, the id goes upstream untouched and vLLM looks it
      # up in its own store — which has never seen it, because Praxis
      # minted it — and returns 404.
      - filter: openai_responses_proxy

      - filter: router
        routes:
          - path_prefix: "/"
            cluster: vllm

      - filter: load_balancer
        clusters:
          - name: vllm
            endpoints: ["127.0.0.1:8000"]

insecure_options:
  allow_private_endpoints: true # vLLM is on loopback

# ---------------------------------------------------------------
# Gotchas
#
# Model name must match /v1/models exactly. vLLM reports the full
# HuggingFace id unless you pass --served-model-name to shorten it.
# A mismatch returns a vLLM 404, surfaced through Praxis.
#
# Started vLLM with --api-key? Add credential_injection to this
# chain or every request gets a 401 from vLLM, not from Praxis:
#
#      - filter: credential_injection
#        clusters:
#          - name: vllm
#            header: Authorization
#            header_prefix: "Bearer "
#            env_var: VLLM_API_KEY
#            strip_client_credential: true
#
# No logs at all? Praxis logs its listener bind at info during
# startup, so total silence means it failed before tracing came up.
# Run with -t first.
#
# ---------------------------------------------------------------
# Next step worth trying
#
# The config above is pure routing — Praxis is not adding anything
# vLLM does not already do. To make it earn its place, give it
# state so previous_response_id continuations work:
#
#      - filter: state_owner
#        mode: single_tenant
#        tenant_id: default
#
#      - filter: openai_response_store
#        backend: sqlite
#        database_url: "sqlite://vllm-responses.db?mode=rwc"
#        responses_table: openai_responses
#        conversations_table: openai_conversations
#
#      - filter: openai_responses_rehydrate
#
# That needs --features store-sqlite on the cargo command, since
# those filters are opt-in. Then a second request carrying
# previous_response_id resolves against the store rather than
# requiring the client to resend history.
# ---------------------------------------------------------------
